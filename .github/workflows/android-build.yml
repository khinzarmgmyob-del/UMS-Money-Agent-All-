name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Build Web Code
        run: |
          npm run build

      - name: Prepare Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Build Android Debug APK
        run: |
          cd android
          # Regenerate clean wrapper using installed Gradle to eliminate any Git-corrupted jar files
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
          # Build APK with fallback directly to gradle binary
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyAgentPOS-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
